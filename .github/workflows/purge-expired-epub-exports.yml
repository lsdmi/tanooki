name: Purge expired EPUB exports

# Daily pass: remove expired EPUB export requests and their attached files.
# Runs on GitHub Actions (not the DO job worker). Generate stays on Solid Queue.
on:
  schedule:
    # 04:00 Europe/Kyiv in summer (EEST, UTC+3) / 05:00 in winter (EET, UTC+2).
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  purge:
    uses: ./.github/workflows/rails-prod-rake.yml
    with:
      rake_task: books:purge_expired_epub_exports
      timeout_minutes: 30
    secrets: inherit
