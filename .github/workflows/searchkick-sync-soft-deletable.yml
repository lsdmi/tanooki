name: Sync Searchkick soft-deletable

# Weekly OpenSearch maintenance. Runs on GitHub Actions (not the DO job worker)
# so a full reindex cannot OOM Solid Queue.
on:
  schedule:
    # 05:00 Europe/Kyiv in summer (EEST, UTC+3) / 06:00 in winter (EET, UTC+2).
    - cron: "0 2 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4.9
          bundler-cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # libvips42: required to boot the app (ruby-vips), even though this job does not compress images.
          sudo apt-get install -y default-libmysqlclient-dev libvips42

      - name: Sync soft-deleted records and reindex
        env:
          RAILS_ENV: production
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          SECRET_KEY_BASE: ${{ secrets.SECRET_KEY_BASE }}
          MAILER_PASSWORD: ${{ secrets.MAILER_PASSWORD }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          TELEGRAM_KEY: ${{ secrets.TELEGRAM_KEY }}
          OPENSEARCH_URL: ${{ secrets.OPENSEARCH_URL }}
          OPENSEARCH_PASSWORD: ${{ secrets.OPENSEARCH_PASSWORD }}
          OPENSEARCH_CA_CERT: ${{ secrets.OPENSEARCH_CA_CERT }}
          STORAGE_ACCESS_KEY: ${{ secrets.STORAGE_ACCESS_KEY }}
          STORAGE_SECRET_KEY: ${{ secrets.STORAGE_SECRET_KEY }}
        run: bundle exec rake searchkick:sync_soft_deletable
