name: Compress chapter images

# Daily pass for chapters posted yesterday. Runs on GitHub Actions (not the DO
# job worker) so large inline images cannot OOM Solid Queue.
on:
  schedule:
    # 03:30 Europe/Kyiv in summer (EEST, UTC+3) / 04:30 in winter (EET, UTC+2).
    - cron: "30 0 * * *"
  workflow_dispatch:
    inputs:
      day:
        description: "Calendar day whose previous day is scanned (YYYY-MM-DD). Defaults to today in app TZ."
        required: false
        type: string

permissions:
  contents: read

jobs:
  compress:
    uses: ./.github/workflows/rails-prod-rake.yml
    with:
      rake_task: chapters:compress_recent
      timeout_minutes: 120
      day: ${{ inputs.day }}
    secrets: inherit
