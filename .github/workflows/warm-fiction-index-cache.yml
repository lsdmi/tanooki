name: Warm fiction index cache

# Hourly pass: preload /fictions/ Solid Cache keys (MySQL-backed).
# Runs on GitHub Actions (not the DO job worker).
on:
  schedule:
    # Every hour at :05 Europe/Kyiv (whole-hour offset → same UTC minute).
    - cron: "5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  warm:
    uses: ./.github/workflows/rails-prod-rake.yml
    with:
      rake_task: fictions:warm_index_cache
      timeout_minutes: 30
    secrets: inherit
