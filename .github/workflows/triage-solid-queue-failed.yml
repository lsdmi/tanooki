name: Triage failed Solid Queue jobs

# Hourly pass: fail stale EPUB exports, retry safe recent failures, purge old failed rows.
# Runs on GitHub Actions (not the DO job worker). Retries re-enqueue onto DO Solid Queue.
on:
  schedule:
    # Every hour at :45 Europe/Kyiv (whole-hour offset → same UTC minute).
    - cron: "45 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  triage:
    uses: ./.github/workflows/rails-prod-rake.yml
    with:
      rake_task: solid_queue:triage
      timeout_minutes: 30
    secrets: inherit
