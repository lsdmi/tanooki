name: Refresh dropped fiction status

# Weekly pass: mark unfinished fictions as dropped after 90 days without a chapter.
# Runs on GitHub Actions (not the DO job worker). Searchkick reindex stays async on DO.
on:
  schedule:
    # Sunday 12:00 Europe/Kyiv in summer (EEST, UTC+3) / 13:00 in winter (EET, UTC+2).
    - cron: "0 9 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4.9
          bundler-cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y default-libmysqlclient-dev libvips42

      - name: Refresh dropped fiction status
        env:
          RAILS_ENV: production
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          SECRET_KEY_BASE: ${{ secrets.SECRET_KEY_BASE }}
          MAILER_PASSWORD: ${{ secrets.MAILER_PASSWORD }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          TELEGRAM_KEY: ${{ secrets.TELEGRAM_KEY }}
          OPENSEARCH_URL: ${{ secrets.OPENSEARCH_URL }}
          OPENSEARCH_PASSWORD: ${{ secrets.OPENSEARCH_PASSWORD }}
          OPENSEARCH_CA_CERT: ${{ secrets.OPENSEARCH_CA_CERT }}
          STORAGE_ACCESS_KEY: ${{ secrets.STORAGE_ACCESS_KEY }}
          STORAGE_SECRET_KEY: ${{ secrets.STORAGE_SECRET_KEY }}
        run: bundle exec rake fictions:refresh_dropped_status
