plugins:
  - rubocop-capybara
  - rubocop-minitest
  - rubocop-performance
  - rubocop-rails

AllCops:
  NewCops: enable
  SuggestExtensions: false
  TargetRailsVersion: 8.1
  Exclude:
    - 'bin/**'
    - 'bin/**/*'
    - 'bin/prod/**/*'
    - 'db/migrate/**'
    - 'db/schema.rb'
    - 'vendor/bundle/**/*'
    - 'vendor/**/*'
    - 'node_modules/**'
    - 'tmp/**'
    - 'coverage/**'

Layout/LineLength:
  Exclude:
    - 'config/initializers/devise.rb'

Metrics/BlockLength:
  Exclude:
    - 'config/environments/*'
    - 'config/routes.rb'

Rails/SkipsModelValidations:
  Exclude:
    - 'app/services/analytics/view_increment.rb'
    - 'app/models/concerns/soft_deletable.rb'

# Soft-delete runs destroy callbacks, so AR :dependent would mutate entries on soft
# delete. Withdraw happens in after_destroy; hard delete cascades via the FK.
Rails/HasManyOrHasOneDependent:
  Exclude:
    - 'app/models/concerns/fiction_contest_entries.rb'
