# Solid Cache stays on primary MySQL (PERFORMANCE_INITIATIVE Stream 6, closed 2026-10-16).
# Do not add a second DBaaS just for cache, and do not move to Redis until Redis exists for
# something else (Action Cable is still async). max_size caps logical byte_size sum; InnoDB
# table size is higher because of BLOB/index overhead — that is expected, not a missed eviction.
default: &default
  database: primary
  store_options:
    max_size: <%= 256.megabytes %>
    namespace: <%= Rails.env %>

development:
  <<: *default

test:
  <<: *default
  store_options:
    max_size: <%= 256.megabytes %>
    namespace: <%= ["test", ENV["TEST_ENV_NUMBER"]].compact.join(":") %>

production:
  <<: *default
  store_options:
    max_size: <%= 256.megabytes %>
    namespace: <%= Rails.env %>
