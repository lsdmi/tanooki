# Daily quest pool. Studio assigns `pick` keys per user per Kiev calendar day.
# Progress events: battle_win | training | chapter_read
# Catch and defense wins left out: wild odds ~2%+8h, and defense is not player-controlled.
# Optional filters: type (Pokémon type key), genre (fiction genre slug),
#                   ranked (true = rating changed), side (attack | defense; unused in pool for now).

pick: 3

quests:
  train_pokemon:
    event: training
    target: 1
  train_twice:
    event: training
    target: 2
  win_battle:
    event: battle_win
    target: 1
  win_ranked:
    event: battle_win
    target: 1
    ranked: true
  win_battle_water:
    event: battle_win
    target: 1
    type: water
  win_battle_electric:
    event: battle_win
    target: 1
    type: electric
  win_battle_grass:
    event: battle_win
    target: 1
    type: grass
  win_battle_fire:
    event: battle_win
    target: 1
    type: fire
  read_chapters:
    event: chapter_read
    target: 3
  read_fantasy_chapters:
    event: chapter_read
    target: 2
    genre: fantasy
  read_horror_chapters:
    event: chapter_read
    target: 2
    genre: horror
  read_action_chapters:
    event: chapter_read
    target: 2
    genre: action
  read_scifi_chapters:
    event: chapter_read
    target: 2
    genre: scifi
  read_romance_chapters:
    event: chapter_read
    target: 2
    genre: romance
  read_adventure_chapters:
    event: chapter_read
    target: 2
    genre: adventure
