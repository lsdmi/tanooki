# Editorial pack for ACQUISITION_AND_HITS_SPIKE §2.3 (loaded by Seo::AcquisitionTales).
drafts:
  - slug: z-choho-pochaty-ranobe-ukrainskoiu-na-batsi
    title: "З чого почати: ранобе українською на Баці"
    heading: Швидкий старт
    intro: >-
      Шукаєте, <strong>з чого почати читати ранобе українською</strong>? Бака — каталог
      перекладів і веб-новел онлайн: без піратських дзеркал і з нормальною навігацією по розділах.
    blurb: >-
      Нижче — шість творів, з яких зручно стартувати, якщо ви прийшли з аніме, манґи або просто
      хочете «щось читати ввечері».
    list_style: ol
    links:
      - ["/fictions/monoloh-aptekarky", "Монолог травниці"]
      - ["/fictions/reinkarnatsiia-bezrobitnoho", "Реінкарнація безробітного"]
      - ["/fictions/volodar-taiemnyts", "Володар Таємниць"]
      - ["/fictions/khaski-ta-yoho-vchytel-bilyi-kit", "Хаскі та його Вчитель білий кіт"]
      - ["/fictions/tochka-zoru-vseznaiuchoho-chytacha-b47a0670-26f6-4924-bfd2-768b71f9b1d3", "Точка зору всезнаючого читача"]
      - ["/fictions/ya-pavuchykha-to-y-shcho", "Я павучиха, то й що?"]
    footer: >-
      <h2>Як обирати далі</h2>
      <p>За жанром зручніше, ніж за назвою: відкрийте
      <a href="/fictions/genres/romance">романтику</a>,
      <a href="/fictions/genres/isekai">ісекай</a>,
      <a href="/fictions/genres/bl">BL</a> або
      <a href="/fictions/genres/fantasy">фентезі</a>
      і дивіться свіжі релізи.</p>
      <p>Повний каталог — на <a href="/fictions">сторінці «Читати ранобе українською»</a>.</p>
      <h2>Чому не лише аніме-новини</h2>
      <p>Аніме часто закінчується на середині сюжету. Ранобе й веб-новели якраз дають «що було далі» —
      і саме їх ми збираємо українською на Баці.</p>

  - slug: bl-ranobe-ukrainskoiu-z-choho-pochaty
    title: "BL-ранобе українською: з чого почати читати"
    heading: Добірка для старту
    intro: >-
      Запити на <strong>BL українською</strong> у пошуку часто ведуть на аніме-добірки або випадкові кліпи.
      Якщо хочете саме <em>читати</em> історії з нормальними розділами й українським перекладом —
      ось шість сильних точок входу в каталозі Баки.
    list_style: ul
    links:
      - ["/fictions/khaski-ta-yoho-vchytel-bilyi-kit", "Хаскі та його Вчитель білий кіт"]
      - ["/fictions/zalyshky-brudu-71a81b9e-7cac-435f-a7a3-36a220e969a1", "Залишки бруду"]
      - ["/fictions/systema-vriatui-sebe-sam-dlia-holovnoho-zlodiia", "Система «врятуй-себе-сам» для головного злодія"]
      - ["/fictions/myslyvets-khoche-zhyty-spokiino", "Мисливець хоче жити спокійно"]
      - ["/fictions/pomylkovyi-poriatunok-lykhodiia", "Помилковий порятунок лиходія"]
      - ["/fictions/pryhoshchaiuchy-vynom", "Пригощаючи вином"]
      - ["/fictions/genres/bl", "Усі твори жанру BL"]
    footer: >-
      <p>Більше в хабі <a href="/fictions/genres/bl">жанру BL</a> — там і легка романтика, і темніші сюжети з інтригою.
      Не обов’язково починати з «найпопулярнішого в світі»: зручніше взяти твір, де вже є стабільні релізи розділів.</p>
      <p>Повернутися до всього каталогу: <a href="/fictions">ранобе та фанфіки українською</a>.</p>

  - slug: isekai-i-reinkarnatsiia-shcho-chytaty-ukrainskoiu
    title: "Ісекай і реінкарнація: що читати українською"
    heading: Куди клікнути першим
    intro: >-
      «Реінкарнація безробітного», «павучиха», графські родини в іншому світі —
      саме ці сюжети люди гуглять поряд із словом <strong>ранобе</strong>. Аніме часто обривається на середині арки;
      текст якраз і є тим «що було далі».
    blurb: >-
      Нижче — твори з каталогу Баки, де можна <strong>читати ісекай українською онлайн</strong>,
      а не лише дивитися адаптацію чи читати спойлери в соцмережах.
    list_style: ul
    links:
      - ["/fictions/reinkarnatsiia-bezrobitnoho", "Реінкарнація безробітного"]
      - ["/fictions/ya-pavuchykha-to-y-shcho", "Я павучиха, то й що?"]
      - ["/fictions/pokydok-hrafskoi-simi", "Покидьок графської сім'ї"]
      - ["/fictions/chornoknyzhnyk-v-sviti-mahiv", "Чорнокнижник в світі магів"]
      - ["/fictions/pererodzhennia-zhyttia-z-nulia-v-inshomu-sviti", "Re: Життя в іншому світі з нуля"]
      - ["/fictions/genres/isekai", "Усі ісекай українською"]
    footer: >-
      <p>Жанровий хаб: <a href="/fictions/genres/isekai">ісекай на Баці</a>.
      Каталог загалом: <a href="/fictions">читати ранобе українською</a>.</p>

  - slug: volodar-taiemnyts-i-temne-fentezi-ukrainskoiu
    title: "Володар Таємниць і темне фентезі українською"
    heading: Читати зараз
    intro: >-
      Назва <strong>Володар Таємниць</strong> (Lord of the Mysteries) часто з’являється в пошуку без слова «ранобе» —
      і тоді видача змішує огляди, вікі та чутки про аніме. Якщо ви шукаєте саме <em>читати</em> історію українською —
      почніть зі сторінки твору на Баці.
    blurb: >-
      Поруч зібрали сусідні темні / детективні / пригодницькі історії з каталогу,
      щоб після фіналу арки було куди піти далі, не випадаючи в англомовний raw.
    list_style: ul
    links:
      - ["/fictions/volodar-taiemnyts", "Володар Таємниць"]
      - ["/fictions/tochka-zoru-vseznaiuchoho-chytacha-b47a0670-26f6-4924-bfd2-768b71f9b1d3", "Точка зору всезнаючого читача"]
      - ["/fictions/tysiacha-osenei-581adbd0-773c-4a85-a26c-941b5a8f079e", "Тисячі осеней"]
      - ["/fictions/genres/fantasy", "Фентезі в каталозі"]
      - ["/fictions/genres/action", "Бойовик у каталозі"]
    footer: >-
      <p>Шукаєте ширше? <a href="/fictions">Каталог ранобе українською</a>
      або жанр <a href="/fictions/genres/fantasy">фентезі</a>.</p>

