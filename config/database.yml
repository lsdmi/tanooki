default: &default
  adapter: mysql2
  encoding: utf8mb4
  charset: utf8mb4_general_ci
  collation: utf8mb4_general_ci
  pool: <%= ENV.fetch("DB_POOL", 5) %>

development:
  <<: *default
  database: tanooki_development
  host: localhost
  username: root
  password: <%= ENV.fetch('DB_PASSWORD') %>

test:
  <<: *default
  database: tanooki_test
  host: 127.0.0.1
  username: root
  password: <%= ENV.fetch('DB_PASSWORD') %>

production:
  <<: *default
  database: <%= ENV.fetch('DB_NAME') %>
  host: <%= ENV.fetch('DB_HOST') %>
  username: <%= ENV.fetch('DB_USER') %>
  password: <%= ENV.fetch('DB_PASSWORD') %>
  port: <%= ENV.fetch('DB_PORT') %>
  # Without these, a silently dropped connection hangs a thread forever.
  connect_timeout: <%= ENV.fetch('DB_CONNECT_TIMEOUT', 5) %>
  read_timeout: <%= ENV.fetch('DB_READ_TIMEOUT', 30) %>
  write_timeout: <%= ENV.fetch('DB_WRITE_TIMEOUT', 30) %>
  # Server-side: drop sessions whose client vanished (e.g. a container killed
  # mid-transaction) so their locks are released. Rails defaults to ~24 days.
  # Must stay above the pool's idle_timeout (300 s).
  wait_timeout: <%= ENV.fetch('DB_WAIT_TIMEOUT', 600) %>
