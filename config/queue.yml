default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    - queues: "*"
      threads: 3
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 1

development:
  <<: *default

test:
  <<: *default

# Polling intervals trade start delay for idle queries: most polls find nothing, and a worker
# polls each of its named queues separately.
production:
  dispatchers:
    - polling_interval: 5
      batch_size: 500
  workers:
    # One thread: memory-heavy jobs (EPUB builds, chapter image extraction) run one at a
    # time so two vips jobs never share the worker's memory.
    - queues:
        - production_heavy
      threads: 1
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 5
    - queues:
        - production_default
        - production_searchkick
        - production_solid_queue_recurring
      threads: 3
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 2
