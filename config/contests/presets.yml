# Contest format presets (CONTESTS.md §3 / §7.7.1). Changing a preset is a PR.
ranobe:
  version: 1
  kind: original
  required_genre: original
  durations:
    announce: 3w
    submissions: 10w
    judging: 3w
  requirements:
    requires_new_work: true
    requires_completed: false
    min_chapters: 3
    judged_chapters_scope: until_close
    max_content_rating: 18
    max_entries_per_user: 1
  jury_weight: 60
  criteria:
    - { key: idea, label: Ідея та оригінальність, weight: 25 }
    - { key: style, label: Мова і стиль, weight: 25 }
    - { key: characters, label: Персонажі, weight: 20 }
    - { key: world, label: Світ і атмосфера, weight: 15 }
    - { key: hook, label: Захопливість, weight: 15 }
  prize_split:
    1: 50
    2: 30
    3: 20
  nominations: [readers_choice, jury_choice, debut]
  donation_goals:
    - { at_uah: 1500, unlocks: [readers_choice, debut], cash_uah: 300 }
    - { at_uah: 3000, unlocks: [continuation], cash_uah: 0 }

